<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <div class="left">
            <header>
                <h1>Registrasi</h1>
                <p>Buat akun Anda untuk memulai</p>
            </header>

            <form id="registerForm" action="#" method="post" novalidate>

                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="name" autocomplete="name" required placeholder="John Doe">
                    <div id="invalid-user" class="error"></div>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required placeholder="emailanda@gmail.com">
                    <div id="invalid-email" class="error"></div>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required placeholder="••••••••">
                    <div id="invalid-pass" class="error"></div>
                </div>

                <div class="form-field">
                    <label for="reg-confirm">Ulangi Password Anda</label>
                    <input type="password" id="reg-confirm" name="confirm_password" autocomplete="new-password" required placeholder="••••••••">
                    <div id="invalid-confirm-pass" class="error"></div>
                    <div id="alertBox" class="alert" style="display:none;"></div>
                </div>

                <!-- <p id="message"></p> -->

                <div id="same-user-pw" class="error"></div>
                
                <div class="terms">
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">
                        Saya setuju dengan <a href="#">Syarat</a> dan <a href="#">Kebijakan Privasi</a>
                    </label>
                </div>

                <footer>
                    <button id="submitBtn" type="submit" class="footer-register-btn">Buat Akun Anda</button>

                    <div class="no-account">
                        <p>Sudah punya akun?</p>
                        <a href="index.html">Masuk</a>
                    </div>

                    <div class="continue-with">Atau lanjutkan dengan</div>

                    <div class="socials">
                        <a class="socials-img" href="#"><img src="./assets/Google.png" alt="Google"></a>
                        <a class="socials-img" href="#"><img src="./assets/Github.png" alt="GitHub"></a>
                        <a class="socials-img" href="#"><img src="./assets/Facebook.png" alt="Facebook"></a>
                    </div>
                </footer>
            </form>
        </div>
    </div>
    <video autoplay muted loop id="myVideo">
        <source src="assets/miku.mp4" type="video/mp4">
    </video>
    <script src="regis.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
